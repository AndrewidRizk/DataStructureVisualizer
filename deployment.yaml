apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: flask-app
  template:
    metadata:
      labels:
        app: flask-app
    spec:
      containers:
      - name: flask-app
        image: flask-k8s-app
        imagePullPolicy: Never
        ports:
          - protocol: TCP
            port: 5000       # Service port
            targetPort: 5000 # Container port
            nodePort: 30000  # Port exposed on the node (optional, Kubernetes will assign one if you omit this)
  